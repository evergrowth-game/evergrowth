name: Test
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no ContentDB release keys in config files
        run: |
          if git grep -nE '^[[:space:]]*release[[:space:]]*=' -- '*.conf'; then
            echo "Error: ContentDB 'release' key found in configuration files. Strip them before committing."
            exit 1
          fi

      - name: Verify no legacy metadata files
        run: |
          LEGACY_FILES=$(find mods \( -name "description.txt" -o -name "depends.txt" -o -name "modpack.txt" \))
          if [ -n "$LEGACY_FILES" ]; then
            echo "Error: Legacy metadata files found (ContentDB requires mod.conf/modpack.conf instead):"
            echo "$LEGACY_FILES"
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cfg:
          - { image: 'ghcr.io/minetest/minetest:5.9.0' }
          - { image: 'ghcr.io/minetest/minetest:5.10.0' }
          - { image: 'ghcr.io/luanti-org/luanti:master' } # latest git
    steps:
    - uses: actions/checkout@v4

    - run: ./utils/test/run.sh
      env:
        DOCKER_IMAGE: "${{ matrix.cfg.image }}"

